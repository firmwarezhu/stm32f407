# OpenOCD configuration: STM32F407 + SEGGER J-Link (SWD) -- FALLBACK PATH.
#
# Preferred: use the native J-Link tools (launch.json "Debug STM32F407 (J-Link)"
# and the "Flash: J-Link" task). This file is only needed if you want OpenOCD
# to drive the J-Link instead.
#
# NOTE: OpenOCD's jlink adapter talks to the probe via libusb/WinUSB. If the
# SEGGER native USB driver is bound to the device, OpenOCD may fail with
# "unable to open J-Link". Either switch that interface to WinUSB with Zadig,
# or just use the native J-Link path.
#
# Manual flash:
#   openocd -f openocd-jlink.cfg -c "program build/direct/stm32f407-blink.elf verify reset exit"

source [find interface/jlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]

adapter speed 4000
